[project]
name = "raga"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "chonkie>=1.7.0",
    "lancedb>=0.38.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "sentence-transformers>=6.0.1",
    "textual>=8.2.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-languages>=1.10.2",
    "typer>=0.27.2",
    "watchdog>=6.0.0",
]

[project.scripts]
raga = "cli.main:app"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "storage*", "watchers*", "ingestion*", "extractors*", "tui*"]